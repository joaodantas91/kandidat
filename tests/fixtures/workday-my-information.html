<!doctype html>
<html lang="en">
  <body>
    <form data-automation-id="applyFlowPage">
      <h2>My Information</h2>

      <div data-automation-id="legalNameSection">
        <label for="firstName">First Name</label>
        <input
          id="firstName"
          data-automation-id="legalNameSection_firstName"
          type="text"
          autocomplete="given-name"
        />

        <label for="middleName">Middle Name</label>
        <input
          id="middleName"
          data-automation-id="legalNameSection_middleName"
          type="text"
        />

        <label for="lastName">Last Name</label>
        <input
          id="lastName"
          data-automation-id="legalNameSection_lastName"
          type="text"
          autocomplete="family-name"
        />
      </div>

      <label for="email">Email Address</label>
      <input
        id="email"
        data-automation-id="email"
        type="email"
        autocomplete="email"
      />

      <label for="phone">Phone Number</label>
      <input
        id="phone"
        data-automation-id="phone-number"
        type="tel"
        autocomplete="tel"
      />

      <div data-automation-id="addressSection">
        <label for="addressLine1">Address Line 1</label>
        <input
          id="addressLine1"
          data-automation-id="addressSection_addressLine1"
          type="text"
        />

        <label for="addressLine2">Address Line 2</label>
        <input
          id="addressLine2"
          data-automation-id="addressSection_addressLine2"
          type="text"
        />

        <label for="city">City</label>
        <input
          id="city"
          data-automation-id="addressSection_city"
          type="text"
        />

        <label for="postalCode">Postal Code</label>
        <input
          id="postalCode"
          data-automation-id="addressSection_postalCode"
          type="text"
        />

        <label for="countryRegion">Country</label>
        <input
          id="countryRegion"
          data-automation-id="countryRegion"
          type="text"
        />
      </div>

      <div data-automation-id="myExperience">
        <label data-automation-id="linkedin">LinkedIn</label>
        <input data-automation-id="linkedin" type="text" />

        <label data-automation-id="github">GitHub</label>
        <input data-automation-id="github" type="text" />

        <label data-automation-id="portfolio">Portfolio</label>
        <input data-automation-id="portfolio" type="text" />

        <label data-automation-id="website">Website</label>
        <input data-automation-id="website" type="text" />

        <label>
          <input type="radio" name="authorized" value="yes" />
          Yes, I am authorized to work
        </label>
        <label>
          <input type="radio" name="authorized" value="no" />
          No, sponsorship required
        </label>
      </div>

      <button data-automation-id="bottom-navigation-next-button" type="button">
        Next
      </button>
      <button data-automation-id="bottom-navigation-save-button" type="button">
        Save
      </button>
      <button
        data-automation-id="bottom-navigation-submit-button"
        type="submit"
      >
        Submit
      </button>
    </form>
  </body>
</html>
