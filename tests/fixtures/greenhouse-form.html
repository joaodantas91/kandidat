<!doctype html>
<html lang="en">
  <body>
    <form id="application_form">
      <label for="first_name">First Name</label>
      <input
        id="first_name"
        name="first_name"
        type="text"
        autocomplete="given-name"
      />

      <label for="last_name">Last Name</label>
      <input
        id="last_name"
        name="last_name"
        type="text"
        autocomplete="family-name"
      />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="question_123">LinkedIn Profile</label>
      <input id="question_123" name="question_123" type="text" />

      <label for="question_456">How did you hear about us?</label>
      <input id="question_456" name="question_456" type="text" />
    </form>
  </body>
</html>
