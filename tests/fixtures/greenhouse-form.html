<!doctype html>
<html lang="en">
  <body>
    <form id="application_form">
      <label for="first_name">First Name</label>
      <input
        id="first_name"
        name="first_name"
        type="text"
        autocomplete="given-name"
      />

      <label for="last_name">Last Name</label>
      <input
        id="last_name"
        name="last_name"
        type="text"
        autocomplete="family-name"
      />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="job_application[location]">Location</label>
      <input id="location" name="job_application[location]" type="text" />

      <label for="question_123">LinkedIn Profile</label>
      <input id="question_123" name="question_123" type="text" />

      <label for="question_github">GitHub</label>
      <input id="question_github" name="question_github" type="text" />

      <label for="question_portfolio">Portfolio</label>
      <input id="question_portfolio" name="question_portfolio" type="text" />

      <label for="question_website">Website</label>
      <input id="question_website" name="question_website" type="text" />

      <label for="question_twitter">Twitter</label>
      <input id="question_twitter" name="question_twitter" type="text" />

      <label for="question_456">How did you hear about us?</label>
      <input id="question_456" name="question_456" type="text" />

      <label for="question_auth">Are you legally authorized to work?</label>
      <input id="question_auth" name="question_auth" type="radio" value="yes" />

      <label for="question_auth_no">No sponsorship required</label>
      <input id="question_auth_no" name="question_auth" type="radio" value="no" />
    </form>
  </body>
</html>
